<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="description" content="Tu mayordomo digital de recordatorios" />

    <!-- Apple PWA meta tags -->
    <!-- Estas etiquetas le dicen a iOS que la app puede instalarse en el home screen
         y que cuando se abre desde ahí, se ve como una app nativa (sin barra de Safari) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Butler" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <!-- Preconnect a Google Fonts para reducir latencia -->
    <!-- ¿Por qué preconnect y no solo el link directo?
         El navegador establece la conexión TCP+TLS ANTES de que necesite la fuente,
         reduciendo el tiempo de carga de ~300ms a ~50ms -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Playfair Display: tipografía serif elegante para headings (estilo editorial/lujo)
         DM Sans: sans-serif limpia para body text (legibilidad en pantallas) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Butler — Tu Mayordomo Digital</title>
  </head>
  <body>
    <!-- El div #root es el punto de montaje de React.
         ¿Por qué un div vacío? React reemplaza su contenido completamente.
         Cualquier HTML aquí solo sirve como fallback si JS falla (sin JS, la PWA
         podría mostrar un mensaje, pero para simplificar lo dejamos vacío) -->
    <div id="root"></div>

    <!-- type="module" es crucial: le dice al browser que este script usa ES Modules,
         habilitando import/export y tree-shaking. Sin esto, Vite no funcionaría. -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
