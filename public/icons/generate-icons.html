<!DOCTYPE html>
<!-- Este archivo existe SOLO para generar los PNGs de íconos.
     Ábrelo en el navegador, haz click en los botones, y descarga los PNGs.
     Luego colócalos en /public/icons/ como icon-192.png e icon-512.png -->
<html>
<head><title>Icon Generator</title></head>
<body style="background:#1a1a1a; color:white; font-family:sans-serif; padding:40px;">
  <h2>Generador de íconos Butler</h2>
  <canvas id="c192" width="192" height="192" style="margin:10px;border:1px solid #333;"></canvas>
  <canvas id="c512" width="512" height="512" style="margin:10px;border:1px solid #333;"></canvas>
  <br>
  <button onclick="download('c192','icon-192.png')" style="margin:10px;padding:10px 20px;background:#c9a96e;border:none;cursor:pointer;color:#000;font-weight:bold;">Descargar icon-192.png</button>
  <button onclick="download('c512','icon-512.png')" style="margin:10px;padding:10px 20px;background:#c9a96e;border:none;cursor:pointer;color:#000;font-weight:bold;">Descargar icon-512.png</button>
  <script>
    function drawIcon(canvasId, size) {
      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext('2d');
      const s = size / 192;
      ctx.fillStyle = '#0a0a0a';
      roundRect(ctx, 0, 0, size, size, 40 * s);
      ctx.fill();
      ctx.fillStyle = '#c9a96e';
      // Brim
      roundRect(ctx, 36*s, 130*s, 120*s, 16*s, 8*s);
      ctx.fill();
      // Body
      roundRect(ctx, 56*s, 86*s, 80*s, 54*s, 6*s);
      ctx.fill();
      // Top
      roundRect(ctx, 72*s, 48*s, 48*s, 42*s, 4*s);
      ctx.fill();
      // Band shadow
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.fillRect(56*s, 106*s, 80*s, 12*s);
    }
    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }
    function download(canvasId, filename) {
      const link = document.createElement('a');
      link.download = filename;
      link.href = document.getElementById(canvasId).toDataURL('image/png');
      link.click();
    }
    drawIcon('c192', 192);
    drawIcon('c512', 512);
  </script>
</body>
</html>
